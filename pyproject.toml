[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "finmind-ai"
version = "0.1.0"
description = "AI-powered personal finance intelligence platform"
requires-python = ">=3.11"


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "backend/tests",
]
python_files = [
    "test_*.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
asyncio_mode = "auto"
addopts = "-ra"


[tool.setuptools.packages.find]
include = [
    "backend*",
]